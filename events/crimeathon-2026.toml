title = "CRIMEATHON 2026"
description = "CRIMEATHON 2026 is a 24-hour cybersecurity investigation hackathon organized by SIMATS Sentrix Cyber Club at SIMATS University, Chennai. Participants investigate simulated cyber incidents by analysing digital evidence, system logs, network traces, and forensic artifacts. Teams reconstruct attack timelines, identify adversaries and attack vectors, and develop practical detection, mitigation, and defence strategies. The competition focuses on cybersecurity, ethical hacking, digital forensics, OSINT, network security, and incident response. Participants present their investigation findings to an evaluation panel."
