title = "K! Hacks 4.0"
description = "K! Hacks 4.0 is a national-level hackathon organized by CEG Tech Forum, Anna University. The event consists of two rounds: an online idea submission round followed by a 24-hour offline hackathon. Participants can develop innovative solutions in domains including Women Empowerment, FinTech, Health Tech, Disaster Management, Environment & Sustainability, and Agentic AI. Top 25 teams will be shortlisted for the offline finale. Winners will receive cash prizes and an opportunity to showcase their projects at Kurukshetra 2027."
