title = "HackSprint 3.0 – Build Bold, Ride Beyond"
description = "HackSprint 3.0 is a national-level 36-hour hackathon organized by the Department of Computer Science and Engineering at Karpagam Academy of Higher Education (KAHE), Coimbatore, in collaboration with the Metaverse Association. The event follows a two-round format, beginning with an online idea submission and screening round, followed by a 36-hour offline hackathon for shortlisted teams. Participants must submit a PowerPoint presentation explaining their problem statement, proposed solution, innovation, feasibility, expected impact, and team portfolio. The hackathon features five tracks: Agrotech, MedTech, EduTech, WildVisionTech, and Open Innovation. Participants will develop working prototypes and present their solutions to a judging panel."
