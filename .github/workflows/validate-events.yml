name: Validate Event TOML Submissions

on:
  pull_request:
    paths:
      - 'events/**'
      - 'src/data/archived.json'
      - 'scripts/**'
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate TOML Schema & Dates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Event Files
        run: npm run validate

      - name: Lint Code
        run: npm run lint

      - name: Check Build
        run: npm run build
