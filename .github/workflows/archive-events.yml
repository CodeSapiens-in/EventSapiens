name: Monthly Automated Event Archiver

on:
  schedule:
    # Runs at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run without modifying files'
        required: false
        default: false
        type: boolean
      reference_date:
        description: 'Optional reference date override (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

jobs:
  archive:
    name: Archive Concluded Events
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Archive Script
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.reference_date }}" ]; then
            ARGS="$ARGS --date=${{ inputs.reference_date }}"
          fi
          npx tsx scripts/archive-events.ts $ARGS

      - name: Commit and Push Changes (if not dry run)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add events/ src/data/archived.json
            git commit -m "chore(archive): auto-archive concluded events for $(date +'%B %Y')"
            git push
          else
            echo "No events needed archiving."
          fi
