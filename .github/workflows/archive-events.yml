name: Monthly Automated Event Archiver

on:
  schedule:
    # Runs at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run without modifying files'
        required: false
        default: false
        type: boolean
      reference_date:
        description: 'Optional reference date override (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: archive-events
  cancel-in-progress: false

jobs:
  archive:
    name: Archive Concluded Events
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Archive Script
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REFERENCE_DATE: ${{ inputs.reference_date }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ -n "$REFERENCE_DATE" ]; then
            ARGS+=("--date=$REFERENCE_DATE")
          fi
          bun run archive -- "${ARGS[@]}"

      - name: Commit and Push Changes (if not dry run)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add events/ src/data/archived.json
            git commit -m "chore(archive): auto-archive concluded events for $(date +'%B %Y')"
            git push
          else
            echo "No events needed archiving."
          fi
